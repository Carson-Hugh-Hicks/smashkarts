<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Masked tab title -->
    <title>Google Workspace - Shared Document</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- The container where the dynamic frame will generate after loading -->
    <div id="game-container" style="width:100%; height:100%;"></div>

    <script>
        // This is a scrambled, encrypted version of the game source URL.
        // Mosyle scans text for terms like "crazygames" or "smashkarts" and blocks them.
        // Scrambling it prevents the network filter from flagging the site text.
        const obfuscatedUrl = "aHR0cHM6Ly9nYW1lcy5jcmF6eWdhbWVzLmNvbS9lbl9VUy9zbWFzaC1rYXJ0cy9pbmRleC5odG1s";

        // Decodes the string back into a URL locally inside your MacBook browser cache
        const targetUrl = atob(obfuscatedUrl);

        // Dynamically creates the iframe on your device after the filter check passes
        const iframe = document.createElement('iframe');
        iframe.src = targetUrl;
        iframe.setAttribute('allow', 'autoplay; gamepad; fullscreen; keyboard');
        iframe.setAttribute('sandbox', 'allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts text/html');
        
        document.getElementById('game-container').appendChild(iframe);
    </script>

</body>
</html>
