<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The title displays on your browser tab. Change it to whatever you want -->
    <title>Class Notes Hub</title>
    <style>
        /* These rules strip all borders and margins to force full-screen coverage */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: sans-serif;
        }
        
        /* Forces the frame to take up 100% of the MacBook browser viewport */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      CRUCIAL FLAGS EXPLAINED:
      - keyboard: Allows WASD / Arrow keys to drive your kart.
      - gamepad: Allows controller support over Bluetooth or USB-C.
      - fullscreen: Allows you to toggle full-screen mode inside the canvas.
    -->
    <iframe 
        src="https://crazygames.com" 
        allow="autoplay; gamepad; fullscreen; keyboard"
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts text/html">
    </iframe>

</body>
</html>
